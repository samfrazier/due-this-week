# Builds, lints, and tests every push and pull request to main.
# Note: GitHub disables workflows on new forks. Enable them once under the
# repo's Actions tab ("I understand my workflows, go ahead and enable them").

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npx eslint "src/**/*.{ts,tsx}"
      - run: npm test -- --silent
